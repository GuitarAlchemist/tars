name: Cross-review verdict

# Combines the reviewers' votes on a PR's head commit into one comment, and
# labels the PR `reviewers-disagree` when one reviewer finds a problem that
# another calls clean. A reviewer with no vote on the head commit counts as
# "not reviewed", never as clean. See .github/scripts/cross_review.py.
#
# It runs when a reviewer votes: Codex through its review or its summary
# comment, Claude through its "Cross-review vote:" comment when that comes
# from the Claude app. Only those two accounts can trigger it. A vote posted
# with a workflow token starts no workflow, so claude-code-review.yml also
# posts the verdict itself after Claude votes. It also runs on every push to
# the PR: the earlier votes were on an older commit, so the verdict and the
# label must not carry over to the new one.

on:
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: cross-review-${{ github.event.issue.number || github.event.pull_request.number }}

jobs:
  verdict:
    if: >-
      (github.event_name == 'pull_request'
        && github.event.pull_request.head.repo.full_name == github.repository)
      || (github.event_name == 'pull_request_review'
        && github.event.review.user.login == 'chatgpt-codex-connector[bot]')
      || (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && ((github.event.comment.user.login == 'chatgpt-codex-connector[bot]'
              && (contains(github.event.comment.body, '**Completed**')
                  || contains(github.event.comment.body, 'Reviewed commit')))
            || (github.event.comment.user.login == 'claude[bot]'
              && startsWith(github.event.comment.body, 'Cross-review vote:'))))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Always the default branch's script, never the PR's.
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts

      - name: Post the verdict
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          python3 .github/scripts/test_cross_review.py
          python3 .github/scripts/cross_review.py post "$PR"
