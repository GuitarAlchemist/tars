name: Karpathy/Cherny Discipline Check

on:
  pull_request:
    paths:
      - 'docs/contracts/digest-schema.json'
      - 'state/digests/**'
      - '.claude/settings.json'
      - '.claude/skills/digest/**'
      - '.claude/skills/correct/**'
      - '.claude/hooks/**'
      - 'go/claudehooks/**'
      - 'CLAUDE.md'
      - '.github/workflows/karpathy-cherny-discipline.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install validators
        run: pip install jsonschema pyyaml

      - name: Verify digest schema is well-formed JSON
        run: python -c "import json; json.load(open('docs/contracts/digest-schema.json'))"

      - name: Verify CLAUDE.md contains Karpathy 4 Rules section
        run: |
          if ! grep -q "Karpathy 4 Rules" CLAUDE.md; then
            echo "::error file=CLAUDE.md::CLAUDE.md must contain a 'Karpathy 4 Rules' section. See .claude/skills/correct/SKILL.md for context."
            exit 1
          fi

      # The hooks are one Go program, go/claudehooks (tars-hooks <hook>): no shell in hooks (the
      # user's rule, 2026-11-05). Mirrors ix's go/claudehooks (ix PR #512).
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/claudehooks/go.mod
          cache: false

      - name: Vet and test the hooks (go/claudehooks)
        working-directory: go/claudehooks
        env:
          GOPROXY: 'off'
        run: |
          go vet ./...
          go test -count=1 ./...

      - name: Verify every hook is wired to tars-hooks, none to a shell or a script
        shell: bash
        run: |
          fail=0
          for h in precompact-digest digest-staleness-nudge correction-detector digest-activity-tracker pr-rationale-capture fsharp-check fsharp-format digest-stop-finalize; do
            if ! grep -q "tars-hooks\\\\\" $h\"" .claude/settings.json; then
              echo "::error file=.claude/settings.json::hook $h is not wired to tars-hooks"
              fail=1
            fi
          done
          if ! grep -q 'run ./cmd/tars-hooks session-start' .claude/settings.json; then
            echo "::error file=.claude/settings.json::session-start (digest injection, binary install) is not wired"
            fail=1
          fi
          if grep '"command"' .claude/settings.json | grep -Eiq '\b(bash|sh|pwsh|powershell|python3?|node)\b|\.(sh|ps1|py|js)\b'; then
            echo "::error file=.claude/settings.json::a hook runs a shell or a script; hooks are Go only (go/claudehooks)"
            fail=1
          fi
          exit $fail

      - name: Verify .claude/settings.json is valid JSON
        run: python -c "import json; json.load(open('.claude/settings.json'))"

      - name: Verify required skills exist
        shell: bash
        run: |
          missing=0
          for f in ".claude/skills/digest/SKILL.md" ".claude/skills/correct/SKILL.md"; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::Required skill missing: $f"
              missing=1
            fi
          done
          exit $missing

      - name: Validate any committed digest archives against schema
        run: |
          python <<'PYEOF'
          import json, glob, re, sys, os
          import yaml
          from jsonschema import validate, ValidationError

          if not os.path.exists('docs/contracts/digest-schema.json'):
              sys.exit(0)
          with open('docs/contracts/digest-schema.json') as f:
              schema = json.load(f)
          errors = []
          for path in glob.glob('state/digests/archive/*.md'):
              with open(path) as f:
                  content = f.read()
              m = re.match(r'^---\n(.*?)\n---', content, re.DOTALL)
              if not m: continue
              try:
                  fm = yaml.safe_load(m.group(1))
                  validate(instance=fm, schema=schema)
              except (ValidationError, yaml.YAMLError) as e:
                  errors.append(f"{path}: {e}")
          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('All committed digests valid (or none committed).')
          PYEOF
